<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我们的家庭旅行</title>
  <style>
    :root {
      --ink: #24342f;
      --muted: #697873;
      --paper: #f6f3eb;
      --card: #fffdf8;
      --green: #1f6653;
      --green-dark: #174b3f;
      --coral: #e9785f;
      --line: #e5e0d5;
      --shadow: 0 14px 42px rgba(37, 54, 48, .12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1180px; margin: auto; padding: 26px 24px 70px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .brand { display: flex; gap: 12px; align-items: center; }
    .mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; color: white; background: var(--green); font-size: 22px; }
    h1 { font-family: Georgia, serif; font-size: 25px; margin: 0; }
    .subtitle { color: var(--muted); font-size: 13px; }
    .btn { text-decoration: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--card); color: var(--ink); font-weight: 700; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37,54,48,.08); }
    .btn.primary { color: white; border-color: var(--green); background: var(--green); }
    .btn.small { padding: 8px 11px; font-size: 13px; }
    .hero { position: relative; overflow: hidden; min-height: 400px; border-radius: 26px; padding: 42px; color: white; display: flex; align-items: end; background: radial-gradient(ellipse at 76% 28%, rgba(111,255,208,.62) 0 4%, transparent 27%), radial-gradient(ellipse at 88% 12%, rgba(108,193,255,.42) 0 3%, transparent 24%), linear-gradient(125deg, #102e2a 0%, #194c43 48%, #163342 100%); box-shadow: var(--shadow); background-size: cover; background-position: center 40%; }
    .hero > div { position: relative; z-index: 1; }
    .hero h2 { font: 46px/1.02 Georgia, serif; max-width: 590px; margin: 0 0 12px; }
    .hero p { margin: 0; max-width: 560px; color: rgba(255,255,255,.88); font-size: 16px; }
    .stats { display: flex; gap: 28px; margin-top: 24px; }
    .stat strong { display: block; font: 25px Georgia, serif; }
    .stat span { font-size: 12px; color: rgba(255,255,255,.75); text-transform: uppercase; letter-spacing: .08em; }
    .toolbar { margin: 30px 0 20px; display: grid; grid-template-columns: 1fr 150px 150px 165px auto; gap: 10px; }
    .control { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; color: var(--ink); background: var(--card); outline: none; }
    .control:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(31,102,83,.12); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 22px; }
    .trip { overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: var(--card); box-shadow: 0 8px 28px rgba(37,54,48,.08); transition: .18s ease; }
    .trip:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .photo { display: block; text-decoration: none; position: relative; height: 235px; background: #d6ddd8 center/cover; }
    .photo:focus-visible { outline: 3px solid var(--coral); outline-offset: -4px; }
    .photo::after, .detail-cover::after { content: attr(data-scene); position: absolute; right: 18px; bottom: 14px; color: rgba(255,255,255,.9); font: 700 12px/1.2 Georgia, serif; letter-spacing: .16em; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,.35); }
    .badge { position: absolute; top: 16px; left: 16px; border-radius: 99px; padding: 7px 11px; background: rgba(255,255,255,.92); color: var(--green-dark); font-size: 12px; font-weight: 800; }
    .heart { position: absolute; right: 16px; top: 16px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); font-size: 18px; color: var(--coral); }
    .trip-body { padding: 20px; }
    .trip-title { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .trip h3 { font: 27px/1.15 Georgia, serif; margin: 0; }
    .place { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; margin: 16px 0; }
    .chip { border-radius: 9px; padding: 6px 9px; background: #edf3ef; color: var(--green-dark); font-size: 12px; font-weight: 700; }
    .summary { color: #56635f; min-height: 45px; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); margin-top: 18px; padding-top: 15px; }
    .card-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .updated { color: var(--muted); font-size: 12px; }
    .empty { display: none; text-align: center; padding: 60px 20px; background: var(--card); border: 1px dashed #cfc7b8; border-radius: 20px; }
    dialog { width: min(760px, calc(100% - 28px)); max-height: 90vh; border: 0; border-radius: 22px; padding: 0; background: var(--card); box-shadow: 0 30px 90px rgba(20,40,34,.3); }
    dialog::backdrop { background: rgba(20,35,31,.58); backdrop-filter: blur(4px); }
    .modal-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--line); background: var(--card); }
    .modal-head h2 { font: 28px Georgia, serif; margin: 0; }
    .close { border: 0; background: transparent; font-size: 26px; color: var(--muted); }
    .detail-cover { position: relative; height: 265px; background: #d6ddd8 center/cover; transition: opacity .16s ease; }
    .detail-content { padding: 26px; }
    .detail-content h2 { font: 34px Georgia, serif; margin: 0 0 4px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; margin-top: 25px; }
    .detail-item strong { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--green); margin-bottom: 4px; }
    .detail-item div { white-space: pre-wrap; }
    .detail-item.full { grid-column: 1/-1; }
    .itinerary { display: grid; gap: 10px; margin-top: 7px; }
    .day { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 12px; border-radius: 12px; background: #f3f0e8; }
    .day b { color: var(--green); }
    .route-map { margin-top: 8px; padding: 14px; border-radius: 16px; background: #edf3ef; overflow: hidden; }
    .route-map svg { display: block; width: 100%; height: auto; min-height: 260px; }
    .route-map .route-line { fill: none; stroke: var(--green); stroke-width: 4; stroke-linecap: round; }
    .route-map .route-return { stroke-dasharray: 9 7; opacity: .8; }
    .route-map .route-side { stroke: var(--coral); stroke-width: 3; }
    .route-map .route-dot { fill: var(--card); stroke: var(--green); stroke-width: 3; }
    .route-map .route-dot.side { stroke: var(--coral); }
    .route-map .route-number { fill: var(--green-dark); font-size: 12px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
    .route-map .route-name { fill: var(--ink); font-size: 13px; font-weight: 800; paint-order: stroke; stroke: #edf3ef; stroke-width: 5px; stroke-linejoin: round; }
    .route-map .route-region { fill: var(--muted); font: italic 18px Georgia, serif; opacity: .55; }
    .route-map-note { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .source-link { color: var(--green); font-weight: 700; overflow-wrap: anywhere; }
    .guide-shell { margin-top: 24px; }
    .guide-intro { margin: 0 0 16px; padding: 14px 16px; border-left: 4px solid var(--coral); border-radius: 0 12px 12px 0; background: #fff4ed; color: #5c514b; }
    .guide-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 3px 1px 12px; scrollbar-width: thin; }
    .guide-tab { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; background: var(--card); color: var(--muted); font-size: 13px; font-weight: 800; }
    .guide-tab[aria-selected="true"] { border-color: var(--green); background: var(--green); color: white; }
    .guide-panel[hidden] { display: none; }
    .guide-panel { padding-top: 7px; }
    .guide-panel h3 { margin: 4px 0 5px; font: 27px Georgia, serif; }
    .guide-kicker { margin: 0 0 15px; color: var(--muted); }
    .day-card { margin-bottom: 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
    .day-card summary { display: grid; grid-template-columns: minmax(92px, .42fr) minmax(0, 1.4fr) auto; gap: 12px; align-items: center; padding: 14px 16px; cursor: pointer; list-style: none; }
    .day-card summary::-webkit-details-marker { display: none; }
    .day-card summary::after { content: "+"; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: #edf3ef; color: var(--green); font-weight: 900; }
    .day-card[open] summary::after { content: "−"; }
    .day-date { color: var(--green); font-size: 12px; font-weight: 900; letter-spacing: .03em; }
    .day-title { font-weight: 850; }
    .day-preview { grid-column: 2; color: var(--muted); font-size: 12px; }
    .day-detail { padding: 0 16px 16px; border-top: 1px solid #eee9df; }
    .day-facts, .day-tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 13px 0; }
    .day-fact, .day-tag { padding: 5px 8px; border-radius: 8px; background: #f3f0e8; color: #55635e; font-size: 12px; font-weight: 750; }
    .day-tag.family { background: #fff0e9; color: #98513f; }
    .day-detail ul, .guide-note-list { margin: 9px 0 0; padding-left: 20px; }
    .day-detail li, .guide-note-list li { margin: 6px 0; }
    .backup-note { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #edf3ef; color: #405c53; font-size: 13px; }
    .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .option-card { padding: 17px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
    .option-card.recommended { border-color: #e9a38f; background: #fff8f4; }
    .option-card h4 { margin: 0 0 5px; font-size: 17px; }
    .option-card p { margin: 5px 0; color: var(--muted); }
    .guide-groups { display: grid; gap: 12px; }
    .guide-group { padding: 15px 16px; border-radius: 14px; background: #f3f0e8; }
    .guide-group h4 { margin: 0 0 7px; }
    .guide-overview { margin-top: 16px; }
    .detail-actions { display: flex; gap: 10px; padding: 0 26px 26px; }
    .share-intro { margin: 0; padding: 22px 24px 10px; color: var(--muted); }
    .share-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px 24px 24px; }
    .share-option { display: grid; align-content: start; gap: 8px; min-height: 166px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
    .share-option h3 { margin: 0; font: 22px Georgia, serif; }
    .share-option p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
    .share-note { margin: 0 24px 24px; padding: 12px 14px; border-radius: 12px; background: #edf3ef; color: #405c53; font-size: 13px; }
    @media (max-width: 760px) {
      .shell { padding: 18px 15px 50px; }
      header { align-items: flex-start; }
      .hero { min-height: 480px; padding: 28px; align-items: flex-start; background-color: #183d34; background-size: cover, auto 340px; background-position: center, 80% bottom; background-repeat: no-repeat; }
      .hero::before { content: ""; position: absolute; top: 140px; left: 0; right: 0; height: 70px; background: linear-gradient(#183d34, transparent); pointer-events: none; }
      .hero h2 { font-size: 30px; }
      .hero p { font-size: 14px; }
      .hero .stats { margin-top: 18px; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar .search { grid-column: 1/-1; }
      .grid { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-item.full { grid-column: auto; }
      .photo { height: 220px; }
      .detail-content { padding: 20px 17px; }
      .detail-content h2 { font-size: 29px; }
      .day-card summary { grid-template-columns: 84px minmax(0,1fr) auto; padding: 13px 12px; gap: 8px; }
      .day-preview { grid-column: 1 / 3; }
      .option-grid { grid-template-columns: 1fr; }
      .share-options { grid-template-columns: 1fr; }
      .detail-actions { flex-wrap: wrap; padding: 0 17px 20px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="mark">⌂</div>
        <div><h1>我们的家庭旅行</h1><div class="subtitle">家庭旅行路线与实用攻略 · 公开分享版</div></div>
      </div>
    </header>

    <section class="hero">
      <div>
        <h2>下一次，我们去哪里？</h2>
        <p>把地图上的向往，变成一家人的回忆。</p>
        <div class="stats">
          <div class="stat"><strong id="tripCount">5</strong><span>旅行想法</span></div>
          <div class="stat"><strong id="shortlistCount">4</strong><span>重点计划</span></div>
          <div class="stat"><strong id="countryCount">3</strong><span>国家</span></div>
        </div>
      </div>
    </section>

    <section class="toolbar" aria-label="Trip filters">
      <input class="control search" id="search" placeholder="搜索目的地、景点或笔记…">
      <select class="control" id="statusFilter"><option value="">全部阶段</option><option>灵感</option><option>调研中</option><option>重点考虑</option><option>计划中</option><option>已完成</option></select>
      <select class="control" id="seasonFilter"><option value="">所有季节</option><option>春季</option><option>夏季</option><option>秋季</option><option>冬季</option></select>
      <select class="control" id="holidayFilter"><option value="">所有假期</option><option>圣诞节 / 新年</option><option>感恩节</option><option>春假</option><option>暑假</option><option>时间未定</option></select>
      <button class="btn" id="clearBtn" title="清空搜索与筛选，显示全部旅行">重置筛选</button>
    </section>

    <section class="grid" id="tripGrid"></section>
    <section class="empty" id="emptyState"><h2>没有找到旅行</h2><p>试试其他关键词，或重置筛选查看全部旅行。</p></section>
  </main>

  <script src="trip-photos.js?v=20261115-family-framing"></script>
  <script src="trips-data.js?v=20261115-hero2"></script>
  <script src="trip-template.js?v=20261115-hero2"></script>
  <script src="dashboard.js?v=20261115-family-framing"></script>
</body>
</html>
